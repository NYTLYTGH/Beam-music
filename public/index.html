<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beam Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#121212;--card:#181818;--hover:#262626;--raise:#2a2a2a;--ink:#fff;--mute:#b3b3b3;--dim:#7a7a7a;--acc:#ffb000;--acc2:#ffc94d;--line:#2a2a2a;--r:8px;--player:84px}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{width:22px;height:22px;fill:currentColor;flex:none}

/* layout */
.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:1fr var(--player);gap:8px;height:100vh;padding:8px 8px 0}
.side{display:flex;flex-direction:column;gap:8px;min-height:0}
.panel{background:var(--panel);border-radius:var(--r)}
.nav{padding:10px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 12px 14px;font-weight:900;font-size:22px;letter-spacing:-.03em}
.brand i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--acc),#ff5f3a,var(--acc));display:grid;place-items:center}
.brand i:after{content:"";width:10px;height:10px;border-radius:50%;background:#000}
.nav a{display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:6px;color:var(--mute);font-weight:700}
.nav a:hover{color:var(--ink);text-decoration:none}.nav a.on{color:var(--ink)}
.lib{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px}
.lib h3{display:flex;align-items:center;gap:12px;margin:4px 8px 14px;color:var(--mute);font-size:15px}
.libscroll{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.prompt{background:var(--raise);border-radius:var(--r);padding:16px;margin-bottom:10px}
.prompt b{display:block;margin-bottom:4px}.prompt p{margin:0 0 14px;color:var(--mute);font-size:13px}
.li{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
.li:hover{background:var(--hover)}.li .meta{min-width:0}.li b,.li small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--mute);font-size:13px}

.main{overflow:auto;position:relative;min-height:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 24px;background:rgba(18,18,18,.0);transition:background .2s}
.top.solid{background:rgba(18,18,18,.92);backdrop-filter:blur(8px)}
.round{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:var(--ink)}
.round svg{width:18px;height:18px}
.top .sp{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:999px;padding:0 14px;height:44px;width:min(380px,100%)}
.searchbox input{background:none;border:0;outline:0;flex:1;height:100%}
.searchbox svg{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 22px;font-weight:700;background:var(--ink);color:#000;transition:transform .1s}
.btn:hover{transform:scale(1.04)}.btn.acc{background:var(--acc)}.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #727272}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink)}.btn.sm{padding:6px 14px;font-size:13px}.btn.link{background:none;color:var(--mute);padding:10px 12px}.btn.link:hover{color:var(--ink)}
.me{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.6);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700}

.view{padding:0 24px 40px}
.hero{margin:-62px -24px 0;padding:90px 24px 24px;background:linear-gradient(hsl(var(--h,35) 55% 32%),var(--panel))}
.hero h1{margin:0;font-size:32px;letter-spacing:-.02em}
h2{font-size:24px;margin:30px 0 14px;letter-spacing:-.02em;display:flex;align-items:baseline;justify-content:space-between}
h2 a{font-size:13px;color:var(--mute);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:22px}
.qt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;font-weight:700;padding-right:56px;height:64px}
.qt:hover{background:rgba(255,255,255,.16)}.qt .cover{width:64px;height:64px;border-radius:0;font-size:22px}
.qt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt .fab{position:absolute;right:10px;width:42px;height:42px;opacity:0;transform:none}
.qt:hover .fab,.card:hover .fab{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:0 -12px}
.card{padding:12px;border-radius:var(--r);cursor:pointer;position:relative;transition:background .2s}
.card:hover{background:var(--card)}
.card .art{position:relative;margin-bottom:10px}
.card b,.card small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--mute);font-size:13px;margin-top:2px}
.card .fab{position:absolute;right:8px;bottom:8px;opacity:0;transform:translateY(8px);transition:.2s}
.card:hover .fab{transform:none}
.cover{aspect-ratio:1;width:100%;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:46px;color:rgba(255,255,255,.88);
  background:radial-gradient(circle at 25% 20%,hsl(calc(var(--h) + 40) 80% 62%),transparent 55%),linear-gradient(135deg,hsl(var(--h) 70% 42%),hsl(calc(var(--h) + 70) 60% 22%));box-shadow:0 8px 24px rgba(0,0,0,.5);text-shadow:0 2px 12px rgba(0,0,0,.35)}
.cover.s{width:40px;height:40px;font-size:16px;border-radius:4px;box-shadow:none}
.cover.m{width:56px;height:56px;font-size:20px;border-radius:4px}
.av{aspect-ratio:1;width:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:900;font-size:52px;background:linear-gradient(135deg,hsl(var(--h) 45% 40%),hsl(calc(var(--h) + 50) 40% 20%));box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;color:#fff}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:28px;height:28px;font-size:12px;box-shadow:none}.av.m{width:48px;height:48px;font-size:18px;box-shadow:none}
.fab{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.fab:hover{background:var(--acc2);transform:scale(1.05)!important}
.fab.l{width:56px;height:56px}.fab svg{width:24px;height:24px}

/* artist page */
.ahead{display:flex;align-items:flex-end;gap:24px;margin:-62px -24px 0;padding:110px 24px 24px;background:linear-gradient(hsl(var(--h) 50% 34%),hsl(var(--h) 40% 18%))}
.ahead .av{width:220px;flex:none;font-size:90px}
.eyebrow{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.ahead h1{font-size:clamp(40px,7vw,92px);line-height:1;margin:6px 0 14px;letter-spacing:-.04em;font-weight:900;word-break:break-word}
.ahead .sub{color:rgba(255,255,255,.85);font-size:14px}
.actions{display:flex;align-items:center;gap:20px;padding:24px 0;background:linear-gradient(rgba(0,0,0,.25),transparent 200px);margin:0 -24px;padding-left:24px;padding-right:24px}
.about{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);max-width:720px;cursor:default}
.about .bg{height:220px;background:radial-gradient(circle at 70% 30%,hsl(var(--h) 60% 45%),transparent 60%),linear-gradient(135deg,hsl(calc(var(--h) + 40) 40% 22%),#181818)}
.about .bg img{width:100%;height:100%;object-fit:cover;opacity:.85}
.about .txt{padding:22px 24px 26px}
.about p{white-space:pre-wrap;color:var(--mute);margin:0 0 16px;font-size:16px}
.about .links{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;font-size:14px}
.about .links a{display:inline-flex;gap:6px;align-items:center}
.about .links svg{width:18px;height:18px}
.empty{color:var(--mute);padding:20px 0}

/* track table */
.tt{width:100%;border-collapse:collapse;margin-top:4px}
.tt th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;border-bottom:1px solid var(--line);padding:8px}
.tt td{padding:8px;color:var(--mute);font-size:14px;vertical-align:middle}
.tt tr.r{border-radius:6px}.tt tr.r:hover td{background:rgba(255,255,255,.07)}
.tt tr.r td:first-child{border-radius:6px 0 0 6px;width:44px;text-align:center}.tt tr.r td:last-child{border-radius:0 6px 6px 0;text-align:right;white-space:nowrap}
.tt .n{font-variant-numeric:tabular-nums}.tt .pi{display:none}
.tt tr.r:hover .n{display:none}.tt tr.r:hover .pi{display:inline-grid}
.tt .pi{color:var(--ink)}.tt .pi svg{width:16px;height:16px}
.tt .tc{display:flex;gap:12px;align-items:center;min-width:0}
.tt .tc b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.tt tr.playing .tc b,.tt tr.playing .n{color:var(--acc)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.1);color:var(--ink)}
.tag.free{background:rgba(255,176,0,.15);color:var(--acc)}
.icob{color:var(--mute);display:inline-grid;place-items:center;padding:6px;border-radius:50%}.icob:hover{color:var(--ink)}
.icob svg{width:18px;height:18px}

/* forms */
.form{max-width:560px;display:grid;gap:14px;margin-top:20px}
label{display:grid;gap:6px;font-size:13px;font-weight:700}
.in{background:var(--raise);border:1px solid transparent;border-radius:6px;padding:12px 14px;width:100%;outline:0}
.in:focus{border-color:#535353;background:#333}
textarea.in{min-height:140px;resize:vertical;line-height:1.5}
.note{color:var(--mute);font-size:13px}.msg{color:var(--acc);min-height:1.4em;font-weight:600}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px}
.stat div{background:var(--card);border-radius:var(--r);padding:18px 22px;min-width:180px}
.stat small{color:var(--mute);display:block}.stat b{font-size:28px;letter-spacing:-.02em}
.drop{display:flex;align-items:center;gap:14px;background:var(--raise);border:1px dashed #555;border-radius:6px;padding:14px;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.dlg{background:#282828;border-radius:var(--r);width:min(540px,100%);padding:24px;max-height:92vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 18px;font-size:24px;display:flex;justify-content:space-between;align-items:center}
.dlg .in{background:#3e3e3e}
.editgrid{display:grid;grid-template-columns:180px 1fr;gap:18px}
.avpick{position:relative;cursor:pointer;border-radius:50%}
.avpick .ov{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;opacity:0;transition:.2s}
.avpick:hover .ov,.avpick:focus-within .ov{opacity:1}
.auth{text-align:center}.auth .in{text-align:left}
.auth .logo{display:inline-flex;margin-bottom:8px}

/* player */
.player{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;padding:0 10px}
.np{display:flex;align-items:center;gap:14px;min-width:0}
.np .meta{min-width:0}.np b,.np small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np b{font-size:14px;font-weight:600}.np small{font-size:12px;color:var(--mute)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl .bt{display:flex;align-items:center;gap:22px}
.ctl .bt button{color:var(--mute)}.ctl .bt button:hover{color:var(--ink)}
.ctl .pp{width:34px;height:34px;border-radius:50%;background:var(--ink)!important;color:#000!important;display:grid;place-items:center}
.ctl .pp svg{width:18px;height:18px}.ctl .bt svg{width:18px;height:18px}
.prog{display:flex;align-items:center;gap:8px;width:100%;max-width:620px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),#4d4d4d var(--p,0%));cursor:pointer;margin:0}
input[type=range]:hover{background:linear-gradient(to right,var(--acc) var(--p,0%),#4d4d4d var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.right{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:var(--mute)}
.right input{max-width:110px}
.toast{position:fixed;left:50%;bottom:calc(var(--player) + 24px);transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:8px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw}
.mnav{display:none}

@media (max-width:820px){
  :root{--player:64px}
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:1fr var(--player) 60px;padding:0;gap:0;height:100dvh}
  .side{display:none}.panel.main{border-radius:0}
  .player{grid-template-columns:1fr auto;background:#1d1d1d;margin:0 6px;border-radius:8px}
  .ctl .prog,.ctl .bt .sec,.right{display:none}
  .mnav{display:flex;justify-content:space-around;align-items:center;background:linear-gradient(transparent,#000 40%)}
  .mnav a{display:grid;justify-items:center;font-size:11px;color:var(--mute);gap:2px}.mnav a.on{color:var(--ink)}
  .ahead{flex-direction:column;align-items:flex-start}.ahead .av{width:160px}
  .editgrid{grid-template-columns:1fr}.avpick{width:150px;margin:0 auto}
  .tt .hm{display:none}
  .view{padding:0 16px 30px}.hero,.ahead,.actions{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .top{padding:12px 16px}
  .toast{bottom:140px}
}
</style></head><body>

<div class="app">
  <aside class="side">
    <nav class="panel nav" aria-label="Main">
      <a class="brand" href="#/"><i></i>Beam Music</a>
      <a href="#/" data-nav="home"><svg><use href="#i-home"/></svg>Home</a>
      <a href="#/search" data-nav="search"><svg><use href="#i-search"/></svg>Search</a>
    </nav>
    <section class="panel lib">
      <h3><svg><use href="#i-lib"/></svg><a href="#/library">Your Library</a></h3>
      <div class="libscroll" id="sidelib"></div>
    </section>
  </aside>

  <main class="panel main" id="main">
    <div class="top" id="top">
      <button class="round" onclick="history.back()" aria-label="Go back"><svg><use href="#i-back"/></svg></button>
      <button class="round" onclick="history.forward()" aria-label="Go forward"><svg><use href="#i-fwd"/></svg></button>
      <div class="sp" id="topmid"></div>
      <div id="topright"></div>
    </div>
    <div class="view" id="view"></div>
  </main>

  <footer class="player" id="player">
    <div class="np" id="np"></div>
    <div class="ctl">
      <div class="bt">
        <button class="sec" id="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button class="pp" id="pp" aria-label="Play"><svg><use href="#i-play"/></svg></button>
        <button class="sec" id="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="prog"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    </div>
    <div class="right">

  <div class="art">${avatar(id)}</div><b>${esc(artistName(id))}</b><small>Artist</small></a>`).join("")+`</div>`}

function vHome(){
  const hr=new Date().getHours(),greet=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";

function vSearch(q){

function route(){
  const h=location.hash.slice(2),[r,arg]=h.split("/");const v=$("#view"),top=$("#topmid");let key=r||"home";
  top.innerHTML="";

    q.oninput=()=>{history.replaceState(null,"","#/search/"+encodeURIComponent(q.value));v.innerHTML=vSearch(q.value)}}
  else if(r==="artist"&&arg)v.innerHTML=vArtist(arg);
  else if(r==="me"){if(me){location.replace("#/artist/"+me.id);return}openAuth("login");v.innerHTML=vHome();key="home"}
  else if(r==="library")v.innerHTML=vLibrary();
  else if(r==="upload"){v.innerHTML=vUpload();bindUpload()}

  else {v.innerHTML=vHome();key="home"}

window.addEventListener("hashchange",route);
$("#main").addEventListener("scroll",e=>$("#top").classList.toggle("solid",e.target.scrollTop>40));

/* ---------- player ---------- */
const audio=$("#audio");audio.volume=.8;
function setPP(){const playing=!audio.paused;$("#pp").innerHTML=ico(playing?"pause":"play");$("#pp").setAttribute("aria-label",playing?"Pause":"Play");
  document.querySelectorAll("[data-playall]").forEach(b=>b.innerHTML=ico(playing&&current&&b.dataset.playall===current.owner?"pause":"play"))}
function renderNP(){const np=$("#np");if(!current){np.innerHTML=`<span class="note">Pick a song to start listening</span>`;$("#dlnow").classList.add("hide");return}
  np.innerHTML=`${cover(current,"m")}<div class="meta"><b>${esc(current.title)}</b><small><a href="#/artist/${current.owner}">${esc(current.artist)}</a></small></div>`;
  $("#dlnow").classList.remove("hide");

async function play(t,list){
  if(!me){openAuth("login");return}
  if(!owned(t)){toast("“"+t.title+"” is "+money(t.price)+". Buy it to listen and download.");if(location.hash!=="#/artist/"+t.owner)location.hash="#/artist/"+t.owner;return}
  if(current?.id===t.id&&audio.src){audio.paused?audio.play():audio.pause();return}
  queue=(list||tracks).filter(owned);qi=queue.findIndex(x=>x.id===t.id);current=t;renderNP();
  try{const j=await api("download?track_id="+t.id);audio.src=j.url;await audio.play()}catch(e){toast(e.message)}}
function step(d){if(!queue.length)return;let i=qi+d;if(i<0||i>=queue.length)return;qi=i;current=null;play(queue[i],queue)}
$("#pp").onclick=()=>{if(!current){const t=tracks.find(owned);if(t)play(t);else toast(me?"Buy or upload a song to start listening":"Log in to start listening");return}
  if(!audio.src)return play(current,queue);audio.paused?audio.play():audio.pause()};
$("#prev").onclick=()=>{if(audio.currentTime>3){audio.currentTime=0}else step(-1)};

audio.onplay=audio.onpause=setPP;audio.onended=()=>step(1);

$("#seek").oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration};
$("#vol").oninput=e=>{audio.volume=e.target.value/100;e.target.style.setProperty("--p",e.target.value+"%")};
$("#dlnow").onclick=()=>current&&download(current);
async function download(t){try{const j=await api("download?track_id="+t.id+"&dl=1");location.href=j.url}catch(e){toast(e.message)}}
async function buy(t){if(!me)return openAuth("login");toast("Opening secure checkout…");try{const j=await api("checkout",{method:"POST",body:JSON.stringify({track_id:t.id})});location.href=j.url}catch(e){toast(e.message)}}

/* ---------- clicks ---------- */
const byId=id=>tracks.find(t=>t.id===id);
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-play],[data-buy],[data-dl],[data-auth],[data-edit],[data-close],[data-playall],#logout");if(!el)return;
  if(el.matches("a[href]")&&!el.dataset.play)return;

  e.preventDefault();e.stopPropagation();
  if(el.dataset.play){const t=byId(el.dataset.play);const ctx=el.closest(".tt")?[...el.closest(".tt").querySelectorAll("tr[data-row]")].map(r=>byId(r.dataset.row)):null;if(t)play(t,ctx)}

  else if(el.dataset.buy){const t=byId(el.dataset.buy);if(t)buy(t)}

  else if(el.hasAttribute("data-close"))el.closest(".modal").classList.add("hide");

document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal").forEach(m=>m.classList.add("hide"));

document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.add("hide")}));

/* ---------- auth ---------- */
function openAuth(mode){$("#amsg").textContent="";$("#authttl span").textContent=mode==="signup"?"Sign up to start listening":"Log in to Beam";$("#authm").classList.remove("hide");$("#em").focus()}
$("#login").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});
  if(r.error)$("#amsg").textContent=r.error.message;else{$("#authm").classList.add("hide");load()}};
$("#signup").onclick=async()=>{const r=await sb.auth.signUp({email:$("#em").value,password:$("#pw").value});
  $("#amsg").textContent=r.error?r.error.message:(r.data.session?"Welcome!":"Check your email to confirm your account, then log in.");
  if(r.data?.session){$("#authm").classList.add("hide");await load();openEdit()}};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#login").click()});

/* ---------- profile editor ---------- */
function openEdit(){if(!me)return openAuth("login");const p=prof(me.id)||{};
  $("#pname").value=p.displayName||"";$("#ploc").value=p.location||"";$("#pabout").value=p.about||"";$("#pweb").value=p.website||"";$("#pig").value=p.instagram?"@"+p.instagram:"";
  $("#pmsg").textContent="";$("#avprev").outerHTML=avatar(me.id).replace('class="av ','id="avprev" class="av ');$("#avremove").classList.toggle("hide",!p.avatarVersion);
  $("#editm").classList.remove("hide");$("#pname").focus()}
$("#psave").onclick=async()=>{const m=$("#pmsg");if(!$("#pname").value.trim()){m.textContent="Add a name for your profile.";return}
  m.textContent="Saving…";
  try{const p=await api("profiles",{method:"PUT",body:JSON.stringify({displayName:$("#pname").value,location:$("#ploc").value,about:$("#pabout").value,website:$("#pweb").value,instagram:$("#pig").value})});
    profiles.set(me.id,p);$("#editm").classList.add("hide");renderShell();route();toast("Profile saved")}catch(e){m.textContent=e.message}};
async function squareJpeg(file,size=480){const img=await createImageBitmap(file);const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=size;
  c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);return new Promise(r=>c.toBlob(r,"image/jpeg",.86))}
$("#avfile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const m=$("#pmsg");
  if(!/^image\//.test(f.type)){m.textContent="Choose an image file.";return}
  m.textContent="Uploading photo…";
  try{const blob=await squareJpeg(f);const t=await tok();const r=await fetch("/api/avatar",{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":"image/jpeg"},body:blob});
    const j=await r.json();if(!r.ok)throw new Error(j.error||"Upload failed");profiles.set(me.id,{...(prof(me.id)||{}),...j});
    $("#avprev").outerHTML=avatar(me.id).replace('class="av ','id="avprev" class="av ');$("#avremove").classList.remove("hide");m.textContent="Photo updated.";renderShell();route()}
  catch(err){m.textContent=err.message}finally{e.target.value=""}};
$("#avremove").onclick=async()=>{try{const j=await api("avatar",{method:"DELETE"});if(j)profiles.set(me.id,j);
  $("#avprev").outerHTML=avatar(me.id).replace('class="av ','id="avprev" class="av ');$("#avremove").classList.add("hide");renderShell();route()}catch(e){$("#pmsg").textContent=e.message}};

/* ---------- upload & earnings ---------- */
function bindUpload(){const b=$("#upbtn");if(!b)return;
  $("#file").onchange=e=>$("#fname").textContent=e.target.files[0]?.name||"Choose an audio file (max 20 MB)";
  b.onclick=async()=>{const m=$("#umsg"),f=$("#file").files[0],title=$("#ttl").value.trim(),art=$("#art").value.trim(),price=Math.round((+$("#prc").value||0)*100);
  if(!title||!art||!f){m.textContent="Add a title, artist name and an audio file.";return}
  if(!f.type.startsWith("audio/")||f.size>20*1024*1024){m.textContent="Choose an audio file under 20 MB.";return}
  m.textContent="Uploading…";b.disabled=true;const path=me.id+"/"+Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_");
  const u=await sb.storage.from("audio").upload(path,f,{contentType:f.type});if(u.error){m.textContent=u.error.message;b.disabled=false;return}
  const i=await sb.from("tracks").insert({title,artist:art,price,path});b.disabled=false;
  if(i.error){m.textContent=i.error.message;return}toast("Uploaded “"+title+"”");await load();location.hash="#/artist/"+me.id}}
async function bindEarnings(){const b=$("#savemomo");if(!b)return;
  const p=await sb.from("profiles").select("momo").eq("id",me.id).maybeSingle();$("#momo").value=p.data?.momo||"";
  b.onclick=async()=>{const r=await sb.from("profiles").upsert({id:me.id,momo:$("#momo").value});$("#emsg").textContent=r.error?r.error.message:"Payout details saved."}}

/* ---------- start ---------- */
renderNP();
(async()=>{const q=new URLSearchParams(location.search),ref=q.get("reference");
  await load();
  if(ref&&me){history.replaceState({},"","/"+location.hash);toast("Confirming your payment…",8000);
    try{await api("verify",{method:"POST",body:JSON.stringify({reference:ref})});toast("Payment confirmed. Your song is ready to play and download.",6000);load()}catch(e){toast(e.message)}}})();
</script></body></html>
